
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf2ff"/><stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#g)"/>
  <rect x="80" y="80" width="1040" height="540" rx="32" fill="#ffffff" stroke="#e9e6df"/>
  <text x="120" y="160" font-family="system-ui" font-size="40" font-weight="700" fill="#202d49">发布后监控 · p95 延迟上升</text>
  <text x="120" y="210" font-family="system-ui" font-size="22" fill="#596780">开发者早上查看监控，发现新功能导致响应时间上升，需向客户说明现象、检查计划并征求认可</text>
  <!-- laptop -->
  <rect x="700" y="260" width="360" height="240" rx="20" fill="#f0f2f7" stroke="#d8ddeb"/>
  <rect x="720" y="280" width="320" height="200" rx="12" fill="#ffffff" stroke="#e9e6df"/>
  <rect x="740" y="300" width="280" height="16" rx="8" fill="#e6eaff"/>
  <rect x="740" y="330" width="240" height="12" rx="6" fill="#e6eaff"/>
  <rect x="740" y="350" width="160" height="12" rx="6" fill="#e6eaff"/>
  <rect x="740" y="370" width="200" height="12" rx="6" fill="#e6eaff"/>
  <!-- chart -->
  <rect x="120" y="300" width="520" height="260" rx="20" fill="#edf5ff" stroke="#d8e6ff"/>
  <text x="140" y="340" font-family="system-ui" font-size="20" font-weight="600" fill="#202d49">p95 延迟</text>
  <polyline points="160,500 220,480 280,470 340,460 400,430 460,420 520,380 580,360 640,340" fill="none" stroke="#546fe0" stroke-width="4"/>
  <circle cx="640" cy="340" r="8" fill="#546fe0"/>
  <text x="660" y="345" font-family="system-ui" font-size="18" fill="#202d49">800 ms ↑</text>
  <!-- people -->
  <circle cx="300" cy="520" r="55" fill="#ffe5d8"/>
  <text x="260" y="528" font-family="system-ui" font-size="16" fill="#202d49">开发者</text>
  <circle cx="500" cy="520" r="55" fill="#eaf6ef"/>
  <text x="460" y="528" font-family="system-ui" font-size="16" fill="#202d49">客户</text>
  <path d="M350 520 L460 520" stroke="#596780" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="120" y="600" font-family="system-ui" font-size="18" fill="#596780">沟通要点：说明现象 → 给出检查动作 → 征求认可 → 慎重回滚</text>
</svg>
