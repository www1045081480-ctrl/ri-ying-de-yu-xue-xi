<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">表单提交故障：一次客户演示前的排查</title>
<desc id="desc">明亮的开发作战室里，开发者检查出现错误的表单，客户通过视频通话等待进展，旁边有一个“演示还有二十分钟”的提示。</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#dff5f1"/><stop offset="1" stop-color="#f5f1ff"/></linearGradient>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#24345b"/><stop offset="1" stop-color="#405b83"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#34456e" flood-opacity=".15"/></filter>
</defs>
<rect width="1200" height="560" rx="30" fill="url(#bg)"/>
<circle cx="1010" cy="95" r="130" fill="#ffe9a6" opacity=".65"/><circle cx="1050" cy="420" r="110" fill="#bddfd9" opacity=".55"/>
<!-- wall --> <rect x="42" y="38" width="1116" height="400" rx="24" fill="#fbfcff" opacity=".76"/>
<!-- window --> <rect x="770" y="64" width="340" height="185" rx="18" fill="#d8e9ff"/><path d="M790 220 Q875 112 970 220 Q1030 140 1092 220Z" fill="#a6d8cf"/><circle cx="1032" cy="111" r="25" fill="#ffd16f"/>
<!-- plant --> <path d="M1080 368v-66m0 34q-38-37-45-9 8 25 45 19m0-19q30-42 44-16-2 26-44 31" fill="none" stroke="#4c9b7c" stroke-width="9" stroke-linecap="round"/><path d="M1054 369h54l-7 52h-40z" fill="#e9a784"/>
<!-- desk --> <path d="M52 427h1096v25H52z" fill="#c58e69"/><path d="M118 451h26v83h-26zm926 0h26v83h-26z" fill="#9d7058"/>
<!-- monitor --> <g filter="url(#shadow)"><rect x="250" y="94" width="485" height="285" rx="20" fill="#202a45"/><rect x="266" y="110" width="453" height="250" rx="12" fill="url(#screen)"/><path d="M454 379h77v37h-77z" fill="#7889a5"/><path d="M419 416h148l20 12H399z" fill="#566783"/></g>
<!-- ui --> <rect x="286" y="132" width="186" height="20" rx="10" fill="#8ea4cb"/><rect x="286" y="172" width="396" height="11" rx="5" fill="#62769f"/><rect x="286" y="193" width="336" height="11" rx="5" fill="#62769f"/>
<rect x="286" y="230" width="392" height="83" rx="14" fill="#314566"/><circle cx="320" cy="272" r="18" fill="#8ee0bb"/><path d="m312 272 6 6 12-14" fill="none" stroke="#1b604d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="350" y="267" fill="#f2f7ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Submission successful!</text><text x="350" y="292" fill="#ffbf8e" font-family="Arial,sans-serif" font-size="15">But the record is missing…</text>
<!-- developer --> <g filter="url(#shadow)"><circle cx="168" cy="328" r="48" fill="#eeb68e"/><path d="M121 323q7-62 59-52 37 8 39 48-24-22-45-24-20 23-53 28" fill="#463850"/><path d="M110 416q12-50 58-50t61 50v15H110z" fill="#647fe0"/><circle cx="153" cy="330" r="4" fill="#30354b"/><circle cx="183" cy="330" r="4" fill="#30354b"/><path d="M159 348q9 7 18 0" fill="none" stroke="#a45f59" stroke-width="3" stroke-linecap="round"/><path d="M207 380q27-19 46 2" fill="none" stroke="#eeb68e" stroke-width="15" stroke-linecap="round"/></g>
<!-- client video call --> <g filter="url(#shadow)"><rect x="820" y="278" width="244" height="144" rx="18" fill="#fff"/><rect x="832" y="290" width="220" height="110" rx="12" fill="#e8f3f7"/><circle cx="940" cy="330" r="26" fill="#d99971"/><path d="M914 326q4-35 33-29 20 4 21 29-19-12-29-17-10 14-25 17" fill="#35425c"/><path d="M899 390q8-38 41-38t42 38" fill="#e3a45f"/><rect x="902" y="408" width="78" height="7" rx="4" fill="#becad8"/></g>
<!-- alert bubble --> <g filter="url(#shadow)"><rect x="60" y="66" width="220" height="86" rx="18" fill="#fff"/><path d="m222 148 16 18 3-20" fill="#fff"/><text x="80" y="101" fill="#3a4561" font-family="Arial,sans-serif" font-size="16" font-weight="700">演示还有</text><text x="80" y="132" fill="#e27354" font-family="Arial,sans-serif" font-size="28" font-weight="800">20 分钟</text></g>
<!-- notebook --> <g transform="rotate(-6 716 477)" filter="url(#shadow)"><rect x="617" y="448" width="206" height="82" rx="12" fill="#fff1bd"/><path d="M640 470h145m-145 17h122m-122 17h93" stroke="#d9bb6d" stroke-width="4" stroke-linecap="round"/><text x="642" y="466" fill="#635d4b" font-family="Arial,sans-serif" font-size="12">检查请求 · 查日志 · 先确认再改</text></g>
<text x="864" y="500" fill="#526785" font-family="Arial,sans-serif" font-size="16" font-weight="700">先排查，再对齐，最后行动。</text>
</svg>
